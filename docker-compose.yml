services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      TZ: ${TZ:-America/Bahia}
      POSTGRES_DB: ${POSTGRES_DB:-scores2026}
      POSTGRES_USER: ${POSTGRES_USER:-scores_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-troque_esta_senha}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-scores_user} -d ${POSTGRES_DB:-scores2026}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    environment:
      TZ: ${TZ:-America/Bahia}
    volumes:
      - redis_data:/data
    expose:
      - "6379"

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: ${TZ:-America/Bahia}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "${BACKEND_BIND_ADDRESS:-127.0.0.1}:${BACKEND_PORT:-18000}:8000"

  telegram:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: ${TZ:-America/Bahia}
    command: python -m app.telegram_bot
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    profiles:
      - telegram

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-https://scores.br10consultoria.com.br/api/v1}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_BIND_ADDRESS:-127.0.0.1}:${FRONTEND_PORT:-18080}:80"

volumes:
  postgres_data:
  redis_data:
