name: Scores 2026 CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependências da API
        working-directory: backend
        run: python -m pip install -r requirements.txt
      - name: Verificar importação das rotas
        working-directory: backend
        run: python -c "from app.api.router import api_router; print('Rotas carregadas:', len(api_router.routes))"
      - name: Testar motor de análises
        working-directory: backend
        run: python -m unittest discover -s tests -v

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependências
        working-directory: frontend
        run: npm ci
      - name: Validar TypeScript e build
        working-directory: frontend
        run: npm run build
